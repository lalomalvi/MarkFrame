[package]
name = "markframe"
version = "1.0.1"
description = "Editor y lector de archivos Markdown para Windows"
authors = ["Luis Eduardo Martinez Villasenor"]
license = "MIT"
repository = "https://github.com/lalomalvi/MarkFrame"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sin `protocol-asset`: las imagenes del disco las sirve el comando `leer_imagen`
# como data URL, asi que el protocolo de recursos nunca se uso. Lo tenia con
# alcance `**` -- permiso para leer cualquier binario del disco desde el webview
# -- sin un solo consumidor. La auditoria del 2026-09-16 lo senalo y se quito.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Una sola ventana: abrir un .md con MarkFrame ya en marcha lo manda como
# pestana nueva a la ventana que ya existe, en vez de levantar otra. Decision
# de Lalo del 2026-09-16, sobre el hallazgo que la auditoria dejo abierto.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
