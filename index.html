<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkFlow</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="barra">
      <button id="abrir" class="boton" title="Abrir un archivo (Ctrl+O)">Abrir</button>
      <button id="guardar" class="boton" title="Guardar (Ctrl+S)" disabled>Guardar</button>

      <span class="separador"></span>

      <button id="deshacer" class="boton icono" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">&#8630;</button>
      <button id="rehacer" class="boton icono" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">&#8631;</button>

      <span class="separador"></span>

      <div class="grupo" role="group" aria-label="Paneles">
        <button id="v-fuente" class="boton" title="Solo el markdown">Fuente</button>
        <button id="v-ambos" class="boton activo" title="Los dos paneles">Ambos</button>
        <button id="v-presentacion" class="boton" title="Solo el texto formateado">Vista</button>
      </div>

      <div class="relleno"></div>
      <span id="nombre" class="nombre">Sin archivo</span>
      <span id="estado" class="estado"></span>
    </header>

    <main id="paneles" class="paneles modo-ambos">
      <section id="caja-fuente" class="panel"></section>
      <div class="division" aria-hidden="true"></div>
      <section id="caja-presentacion" class="panel"></section>
    </main>

    <div id="soltar" class="soltar" hidden><span>Suelta el archivo para abrirlo</span></div>

    <div id="velo" class="velo" hidden>
      <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dlg-titulo">
        <h2 id="dlg-titulo">Hay cambios sin guardar</h2>
        <p id="dlg-texto"></p>
        <div class="dialogo-botones">
          <button id="dlg-guardar" class="boton primario">Guardar y salir</button>
          <button id="dlg-descartar" class="boton">Salir sin guardar</button>
          <button id="dlg-cancelar" class="boton">Cancelar</button>
        </div>
      </div>
    </div>
  </body>
</html>
