<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkFlow</title>
    <link rel="stylesheet" href="/src/tipografias.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="barra">
      <button id="abrir" class="boton" title="Abrir un archivo (Ctrl+O)">Abrir</button>
      <button id="guardar" class="boton" title="Guardar (Ctrl+S)" disabled>Guardar</button>

      <span class="separador"></span>

      <button id="deshacer" class="boton icono" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">&#8630;</button>
      <button id="rehacer" class="boton icono" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">&#8631;</button>

      <span class="separador"></span>

      <div class="grupo" role="group" aria-label="Paneles">
        <button id="v-fuente" class="boton" title="Sólo el markdown">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 3.2 2.4 8 6 12.8M10 3.2 13.6 8 10 12.8" />
          </svg>
          <span>Fuente</span>
        </button>
        <button id="v-ambos" class="boton activo" title="Los dos paneles">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6" />
            <path d="M8 2.8 L8 13.2" />
          </svg>
          <span>Ambos</span>
        </button>
        <button id="v-presentacion" class="boton" title="Sólo el texto formateado">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1.4 8s2.4-4.3 6.6-4.3S14.6 8 14.6 8s-2.4 4.3-6.6 4.3S1.4 8 1.4 8Z" />
            <circle cx="8" cy="8" r="1.9" />
          </svg>
          <span>Vista</span>
        </button>
      </div>

      <div class="relleno"></div>
      <span id="nombre" class="nombre">Sin archivo</span>
      <span id="estado" class="estado"></span>

      <button id="tema" class="boton icono" title="Tema" aria-label="Cambiar tema">
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <circle id="tema-disco" cx="8" cy="8" r="3.4" />
          <g id="tema-rayos">
            <path d="M8 .9V2.4M8 13.6v1.5M2.9 2.9 4 4M12 12l1.1 1.1M.9 8h1.5M13.6 8h1.5M2.9 13.1 4 12M12 4l1.1-1.1" />
          </g>
          <path id="tema-luna" d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" />
        </svg>
      </button>
      <button id="opciones" class="boton icono" title="Opciones" aria-label="Opciones">
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2" />
          <path d="M8 1.2v1.6M8 13.2v1.6M14.8 8h-1.6M2.8 8H1.2M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1M12.8 12.8l-1.1-1.1M4.3 4.3 3.2 3.2" />
        </svg>
      </button>
    </header>

    <main id="paneles" class="paneles modo-ambos">
      <section id="caja-fuente" class="panel"></section>
      <div id="division" class="division" role="separator" aria-orientation="vertical"
           title="Arrastra para repartir. Doble clic: mitad y mitad"></div>
      <section id="caja-presentacion" class="panel"></section>
    </main>

    <div id="soltar" class="soltar" hidden><span>Suelta el archivo para abrirlo</span></div>

    <!-- panel de opciones -->
    <div id="velo-op" class="velo-op" hidden></div>
    <aside id="panel-op" class="panel-op" hidden aria-label="Opciones">
      <header class="op-cabeza">
        <h2>Opciones</h2>
        <button id="op-cerrar" class="boton icono" aria-label="Cerrar opciones">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 3.5l9 9M12.5 3.5l-9 9" />
          </svg>
        </button>
      </header>

      <div class="op-cuerpo">
        <section class="op-grupo">
          <h3>Aspecto</h3>
          <label class="op-fila">
            <span>Tema</span>
            <select id="op-tema">
              <option value="sistema">Sigue a Windows</option>
              <option value="claro">Claro</option>
              <option value="oscuro">Oscuro</option>
            </select>
          </label>
          <label class="op-fila">
            <span>Profundidad del oscuro</span>
            <select id="op-profundidad">
              <option value="suave">Suave — el del icono</option>
              <option value="normal">Normal</option>
              <option value="profundo">Profundo — casi negro</option>
            </select>
          </label>
          <label class="op-fila">
            <span>Colores del código</span>
            <select id="op-paleta">
              <option value="tinta">Tinta — azul y rosa</option>
              <option value="notas">Notas y Nodos</option>
              <option value="sobria">Sobria — un solo acento</option>
            </select>
          </label>
        </section>

        <section class="op-grupo">
          <h3>Letra</h3>
          <label class="op-fila">
            <span>Texto</span>
            <select id="op-fuente-texto"></select>
          </label>
          <label class="op-fila">
            <span>Monoespaciada</span>
            <select id="op-fuente-mono"></select>
          </label>
          <label class="op-fila">
            <span>Tamaño <b id="op-tamano-v"></b></span>
            <input id="op-tamano" type="range" min="11" max="26" step="0.5" />
          </label>
          <label class="op-fila">
            <span>Interlineado <b id="op-interlineado-v"></b></span>
            <input id="op-interlineado" type="range" min="1.2" max="2.4" step="0.05" />
          </label>
          <label class="op-fila">
            <span>Ancho de columna <b id="op-ancho-v"></b></span>
            <input id="op-ancho" type="range" min="0" max="80" step="2" />
          </label>
          <p class="op-nota">Ancho 0 = sin límite: el texto ocupa todo el panel.</p>
        </section>

        <section class="op-grupo">
          <h3>Editor</h3>
          <label class="op-fila">
            <span>Números de línea</span>
            <input id="op-numeros" type="checkbox" />
          </label>
          <label class="op-fila">
            <span>Sangría</span>
            <select id="op-sangria">
              <option value="2">2 espacios</option>
              <option value="4">4 espacios</option>
              <option value="tab">Tabulador</option>
            </select>
          </label>
          <label class="op-fila">
            <span>Scroll en pantalla dividida</span>
            <select id="op-scroll">
              <option value="independiente">Independiente</option>
              <option value="ligado">Ligado — el mismo renglón en los dos</option>
            </select>
          </label>
          <label class="op-fila">
            <span>Reabrir el último archivo al arrancar</span>
            <input id="op-reabrir" type="checkbox" />
          </label>
        </section>

        <section class="op-grupo">
          <button id="op-fabrica" class="boton">Volver a los valores de fábrica</button>
        </section>
      </div>
    </aside>

    <!-- dialogo de cambios sin guardar / avisos -->
    <div id="velo" class="velo" hidden>
      <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dlg-titulo">
        <h2 id="dlg-titulo">Hay cambios sin guardar</h2>
        <p id="dlg-texto"></p>
        <p id="dlg-detalle" class="detalle" hidden></p>
        <div class="dialogo-botones">
          <button id="dlg-guardar" class="boton primario">Guardar y salir</button>
          <button id="dlg-descartar" class="boton">Salir sin guardar</button>
          <button id="dlg-cancelar" class="boton">Cancelar</button>
          <button id="dlg-aceptar" class="boton primario" hidden>Entendido</button>
        </div>
      </div>
    </div>
  </body>
</html>
